plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Arcforge: the full mod jar, since the tower renderer uses its client classes (StructureRenderer, MeshRendering).
    // Players install Arcforge itself; localRuntime puts it in the dev runs without publishing a dependency on it.
    compileOnly files("libs/arcforge-${arcforge_version}+${minecraft_version}.jar")
    localRuntime files("libs/arcforge-${arcforge_version}+${minecraft_version}.jar")

    // Unit tests for the grid's maths (grid/, grid/data/, tower/model/): plain Java, run outside the game.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

repositories {
    mavenCentral()
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Renders the tower models to build/previews for review (ModelPreview): ./gradlew renderPreviews [-Pdesigns=A,B~ALT].
tasks.register('renderPreviews', JavaExec) {
    group = 'verification'
    description = 'Renders TowerMesh designs to build/previews'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.zagdrath.arcforgetransmission.tower.model.ModelPreview'
    args file('src/main/resources/assets/arcforgetransmission/textures/block/transmission_tower/towers.png').path,
            layout.buildDirectory.dir('previews').get().asFile.path,
            (project.findProperty('designs') ?: '').toString()
    systemProperty 'java.awt.headless', 'true'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            arcforge_version_range : arcforge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
