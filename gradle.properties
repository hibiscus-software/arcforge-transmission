org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=26.3
minecraft_version_range=[26.3]
# Matches the NeoForge version Arcforge is built against. Later builds (e.g. 26.3.0.92) do not compile under
# NeoGradle 7.1.39: only the patched Minecraft classes end up on the classpath.
neo_version=26.3.0.23-beta

# Mod Properties
mod_id=arcforgetransmission
mod_name=Arcforge: Transmission
mod_license=MIT
mod_version=1.0.0
mod_group_id=net.zagdrath.arcforgetransmission

# Arcforge
# The Arcforge jar in libs/ that this addon compiles and runs against.
arcforge_version=2.8.1
arcforge_version_range=[2.8.1,)
